<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BankEase - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0.8rem 1.5rem;
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.35rem;
      color: #0d6efd !important;
      letter-spacing: -0.5px;
    }
    .nav-link {
      font-size: 0.95rem;
      color: #475569 !important;
      font-weight: 500;
      margin: 0 5px;
    }
    .nav-link:hover {
      color: #0d6efd !important;
    }
    .card-login {
      max-width: 440px;
      margin: 4rem auto;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
      background-color: #ffffff;
      padding: 2.5rem;
    }
    .form-label {
      font-weight: 500;
      font-size: 0.9rem;
      color: #334155;
      margin-bottom: 0.4rem;
    }
    .form-control {
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-primary {
      background-color: #0d6efd;
      border-color: #0d6efd;
      border-radius: 8px;
      font-weight: 600;
      padding: 0.7rem;
    }
    .btn-primary:hover {
      background-color: #0b5ed7;
    }
    .demo-credentials {
      background-color: #f1f5f9;
      border-left: 4px solid #0d6efd;
      border-radius: 6px;
      padding: 0.8rem;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #334155;
    }
    footer {
      margin-top: auto;
      text-align: center;
      padding: 1.5rem;
      color: #94a3b8;
      font-size: 0.85rem;
      border-top: 1px solid #e2e8f0;
      background-color: #ffffff;
    }
    .dark-mode {
      background-color: #0f172a !important;
      color: #f8fafc !important;
    }
    .dark-mode .navbar, .dark-mode .card-login, .dark-mode footer {
      background-color: #1e293b !important;
      border-color: #334155 !important;
      color: #f8fafc !important;
    }
    .dark-mode .form-label, .dark-mode .demo-credentials {
      color: #cbd5e1 !important;
    }
    .dark-mode .demo-credentials {
      background-color: #334155 !important;
    }
    .dark-mode .form-control {
      background-color: #0f172a !important;
      border-color: #475569 !important;
      color: #f8fafc !important;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar matching Chapter 5 -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="standalone_website.html">BankEase</a>
      <div class="navbar-nav ms-auto align-items-center">
        <a class="nav-link" href="standalone_website.html">Home</a>
        <a class="nav-link" href="standalone_website.html#register">Register</a>
        <a class="nav-link text-primary fw-bold" href="standalone_login.html">Login</a>
        <button class="btn btn-sm btn-outline-secondary ms-2" onclick="document.body.classList.toggle('dark-mode')">Dark Mode</button>
      </div>
    </div>
  </nav>

  <!-- Login Form Box -->
  <div class="container">
    <div class="card card-login">
      <h3 class="text-center fw-bold mb-4" style="color: #1e293b;">Login to BankEase</h3>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">Email or Account Number</label>
          <input type="text" id="loginId" class="form-control" placeholder="e.g. jagathselva15@gmail.com" value="jagathselva15@gmail.com" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" value="password123" required>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small"></div>

        <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
      </form>

      <div class="text-center mt-3">
        <small class="text-muted">Don't have an account? <a href="standalone_website.html#register" class="text-decoration-none">Register here</a></small>
      </div>

      <!-- Quick Demo Credentials from Project Report -->
      <div class="demo-credentials">
        <strong>Demo Login (from Report):</strong><br>
        Email: <code>jagathselva15@gmail.com</code><br>
        Account No: <code>383588248332</code><br>
        Password: <code>password123</code>
      </div>
    </div>
  </div>

  <footer>
    © 2026 BankEase — Secure banking built with Flask.
  </footer>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const loginId = document.getElementById('loginId').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('loginAlert');

      if (!loginId || !password) {
        alertBox.textContent = 'Please enter both login ID and password.';
        alertBox.classList.remove('d-none');
        return;
      }

      // Successful redirect to full dashboard interface
      window.location.href = 'standalone_website.html#dashboard';
    }
  </script>
</body>
</html>
